# BasicShop Messages & Sounds Configuration
# All message text supports MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Powered by YamlMessageAPI
# If a message is empty = "" then it is suppressed and not sent (e.g. top-sellers-footer: "").
# If a blank spacer line is desired in chat, configure it with a single space: " "

prefix: "<dark_gray>[<gold>BasicShop</gold>]</dark_gray> "

no-permission: "<red>You do not have permission to do that."
player-only: "<red>This command can only be used by players."
reload-success: "<green>Configuration reloaded successfully."

shop-buy-disabled: "<red>Buying is currently disabled."
shop-sell-disabled: "<red>Selling is currently disabled."

item-buy-disabled: "<red>This item cannot be bought."
item-sell-disabled: "<red>This item cannot be sold."

buy-success: "<green>You bought <white><amount>x <item></white> for <gold><price></gold>."
sell-success: "<green>You sold <white><amount>x <item></white> for <gold><price></gold>."

insufficient-funds: "<red>You do not have enough money. Required: <gold><price></gold>."
not-enough-items: "<red>You do not have enough of that item to sell."

no-sellable-items: "<yellow>You have no sellable items in your inventory."
quicksell-hand-empty: "<yellow>You are not holding any item."
quicksell-inventory-success: "<green>Sold all sellable items for a total of <gold><price></gold>."

tool-staff-line: "<green>You sold <white><amount>x <item></white> for <gold><price></gold> with Money Staff."
tool-hoe-success: "<green>Sold crop drops for <gold><price></gold> and replanted."
tool-hoe-autosell-on: "<green>Auto-sell enabled."
tool-hoe-autosell-off: "<yellow>Auto-sell disabled."
tool-sorting-staff-success: "<green>Container sorted successfully."

give-success: "<green>Gave <white><amount>x <tool></white> to <white><player></white>."
give-player-not-found: "<red>That player is not online."
give-invalid-tool: "<red>Unknown tool. Use <white>money_staff</white>, <white>money_hoe</white>, or <white>sorting_staff</white>."

vault-unavailable: "<red>Economy provider is unavailable. Please contact an administrator."

unknown-item: "<red>That item is not configured in the shop."

# Top sellers command
top-sellers-header: "<dark_gray>------- <gold><bold>Top Selling Items</bold></gold> <gray>(Last <days> Days)</gray> -------"
top-sellers-format: "<gold>#<rank></gold> <white><item></white> <dark_gray>—</dark_gray> <green><total_profit></green> <gray>(<amount> sold)</gray>"
top-sellers-footer: "<dark_gray>----------------------------------------"
top-sellers-empty: "<gray>No items have been sold in the last <days> days."

# Admin analytics
analytics-uploading: "<yellow>Preparing and uploading analytics for the last <days> days to Cloudflare...</yellow>"
analytics-upload-success: "<green>Analytics successfully uploaded!</green><newline><gray>Dashboard Link: </gray><hover:show_text:'<gray>Click to open web analytics dashboard'><click:open_url:'<url>'><underlined><gold>[Click to View Web Analytics]</gold></underlined></click></hover><newline><dark_gray>(This report expires in <expiration> hour(s))</dark_gray>"
analytics-upload-failed: "<red>Failed to upload analytics: <white><reason></white>"
analytics-not-configured: "<red>Web analytics is not configured. Please set <white>upload-url</white> in config.yml."
analytics-ingame-header: "<dark_gray>======= <gold><bold>Shop Analytics</bold></gold> <gray>(Last <days> Days)</gray> ======="
analytics-ingame-summary: "<gray>Transactions: <white><transactions></white> | Volume: <white><units></white> items<newline><gray>Player Sell Payouts: <green><total_sold></green><newline><gray>Player Purchases: <gold><total_bought></gold><newline><gray>Net Economy Delta: <net_delta>"
analytics-ingame-footer: "<dark_gray>=========================================="

# Admin transaction logs
logs-header: "<dark_gray>------- <gold>Transaction Logs</gold> <gray>(<date>)</gray> -------"
logs-line: "<dark_gray>[<gray><time></gray>]</dark_gray> <action> <white><amount>x <item></white> <dark_gray>—</dark_gray> <gold><price></gold> <dark_gray>(<gray><player></gray>)</dark_gray>"
logs-summary: "<gray>Total: <gold><count></gold> transactions <dark_gray>•</dark_gray> <gray>Sold: <green><total_sold></green></gray> <dark_gray>•</dark_gray> <gray>Bought: <gold><total_bought></gold></gray>"
logs-empty: "<yellow>No transaction logs found for date <white><date></white>."
logs-invalid-date: "<red>Invalid date '<white><date></white>'. Use YYYY-MM-DD, 'today', or 'yesterday'."

# GUI and transaction sound-only messages using Minecraft namespaces
open-category-sound:
  sound: "ui.button.click,1.0,1.2"

back-to-categories-sound:
  sound: "ui.button.click,1.0,0.8"

gui-click-sound:
  sound: "ui.button.click,0.8,1.0"

sell-sound:
  sound: "entity.experience_orb.pickup,0.5,1.2"
